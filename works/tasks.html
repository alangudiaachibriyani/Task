<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAB Works Tracker — My Tasks</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0ede6;
    --border: #e2ddd6;
    --text: #1a1917;
    --muted: #7a7670;
    --accent: #c8401a;
    --accent-light: #fdf0eb;
    --green: #1a7a45;
    --green-light: #eaf5ef;
    --amber: #a05c00;
    --amber-light: #fef7ec;
    --blue: #1a4f8a;
    --blue-light: #eaf1fb;
    --radius: 10px;
    --shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  .header { background: var(--text); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  .header img { height: 36px; border-radius: 6px; }
  .header-title { font-size: 16px; font-weight: 600; }
  .header-sub { font-size: 12px; opacity: 0.6; }

  .overlay { position: fixed; inset: 0; background: rgba(26,25,23,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .picker-card { background: var(--surface); border-radius: 16px; padding: 32px 28px; width: 340px; max-width: 95vw; }
  .picker-card h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .picker-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .name-btn { padding: 12px 10px; border: 1.5px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500; text-align: center; transition: all 0.15s; }
  .name-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .name-btn .dept { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }

  .topbar { padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--surface); }
  .user-pill { display: flex; align-items: center; gap: 8px; background: var(--accent-light); border: 1px solid #f0c4b0; border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--accent); cursor: pointer; }
  .user-pill .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .tab-row { display: flex; gap: 6px; margin-left: auto; }
  .tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1.5px solid var(--border); background: transparent; color: var(--muted); transition: all 0.15s; }
  .tab.active { background: var(--text); color: #fff; border-color: var(--text); }

  .stats { display: flex; gap: 10px; padding: 14px 16px; overflow-x: auto; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; min-width: 110px; flex-shrink: 0; }
  .stat-num { font-size: 24px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .stat.open .stat-num { color: var(--blue); }
  .stat.done .stat-num { color: var(--green); }
  .stat.hold .stat-num { color: var(--amber); }
  .stat.score .stat-num { color: var(--accent); }

  .task-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }

  /* Task card */
  .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .task-card.completed { opacity: 0.65; }

  /* Card top banner: priority colour strip */
  .card-banner { height: 4px; }
  .card-banner.High   { background: #b91c1c; }
  .card-banner.Medium { background: var(--amber); }
  .card-banner.Low    { background: var(--green); }

  .card-body { padding: 14px 16px; }

  .task-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .task-id { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; margin-top: 3px; background: var(--surface2); padding: 2px 7px; border-radius: 6px; }
  .task-name { font-size: 15px; font-weight: 700; flex: 1; line-height: 1.3; }

  /* Priority + status row — big and prominent */
  .task-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .priority-badge { font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
  .priority-badge.High   { background: #fde8e8; color: #b91c1c; }
  .priority-badge.Medium { background: var(--amber-light); color: var(--amber); }
  .priority-badge.Low    { background: var(--green-light); color: var(--green); }
  .status-pill { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
  .status-pill.Open        { background: var(--blue-light); color: var(--blue); }
  .status-pill.In-Progress { background: var(--amber-light); color: var(--amber); }
  .status-pill.Hold        { background: #f3f3f3; color: var(--muted); }
  .status-pill.Completed   { background: var(--green-light); color: var(--green); }
  .score-badge { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-light); padding: 4px 12px; border-radius: 20px; }

  /* Due date — big block */
  .due-block { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
  .due-block.normal  { background: var(--blue-light); }
  .due-block.overdue { background: #fde8e8; }
  .due-block.done    { background: var(--green-light); }
  .due-icon { font-size: 20px; }
  .due-label { font-size: 11px; color: var(--muted); }
  .due-date  { font-size: 16px; font-weight: 700; }
  .due-date.overdue { color: #b91c1c; }
  .due-date.normal  { color: var(--blue); }
  .due-date.done    { color: var(--green); }
  .due-tag { margin-left: auto; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; }
  .due-tag.overdue { background: #b91c1c; color: #fff; }
  .due-tag.done    { background: var(--green); color: #fff; }

  .task-assigned { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

  /* Comment log */
  .comment-log { background: var(--surface2); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .comment-log-title { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .comment-entry { font-size: 12px; color: var(--text); line-height: 1.5; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .comment-entry:last-child { border-bottom: none; }
  .comment-entry .ts { font-size: 10px; color: var(--muted); display: block; margin-bottom: 2px; }

  /* Actions */
  .task-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .action-group { display: flex; flex-direction: column; gap: 4px; }
  .action-label { font-size: 11px; font-weight: 600; color: var(--muted); }
  .status-select { font-size: 13px; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; color: var(--text); }
  .comment-row { display: flex; gap: 6px; flex: 1; min-width: 220px; align-items: flex-end; }
  .comment-input { flex: 1; font-size: 13px; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .comment-input:focus { outline: none; border-color: var(--accent); }
  .save-btn { padding: 8px 18px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; height: 38px; }
  .save-btn:hover { opacity: 0.88; }
  .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty .icon { font-size: 40px; margin-bottom: 10px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <img src="https://raw.githubusercontent.com/alangudiaachibriyani/HR/main/logo.png" alt="AAB" onerror="this.style.display='none'">
  <div>
    <div class="header-title">AAB Works Tracker</div>
    <div class="header-sub">Staff Task View</div>
  </div>
</div>

<!-- Name picker -->
<div class="overlay" id="overlay">
  <div class="picker-card">
    <h2>Who are you?</h2>
    <p>Select your name to see your tasks</p>
    <div class="name-grid" id="nameGrid">
      <div style="color:#aaa;font-size:13px;grid-column:span 2;text-align:center;padding:20px">Loading employees…</div>
    </div>
  </div>
</div>

<!-- Main UI -->
<div id="mainUI" style="display:none">
  <div class="topbar">
    <div class="user-pill" onclick="changeName()">
      <div class="dot"></div>
      <span id="userName">—</span>
      <span style="font-size:11px;opacity:0.7">▼</span>
    </div>
    <div class="tab-row">
      <button class="tab active" onclick="switchTab('mine',this)">My Tasks</button>
      <button class="tab" onclick="switchTab('all',this)">All Open</button>
    </div>
  </div>

  <div class="stats" id="statsRow"></div>
  <div class="task-list" id="taskList"><div class="loading">Loading tasks…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzkkSEMDidoAoHvq7hjepgkI_Xcblh6oPSkysrrfMmK2ntuCyGzfV4uSpZM0D7zqmMO2A/exec';
let currentUser = localStorage.getItem('aab_user') || '';
let currentTab  = 'mine';
let allTasks    = [];
let employees   = [];

function jsonp(params, cb) {
  const id  = 'cb_' + Date.now() + Math.floor(Math.random()*1000);
  const qs  = Object.entries({ ...params, callback: id }).map(([k,v]) => k+'='+encodeURIComponent(v)).join('&');
  const s   = document.createElement('script');
  window[id] = d => { delete window[id]; s.remove(); cb(d); };
  s.src = API + '?' + qs;
  document.head.appendChild(s);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function loadEmployees() {
  jsonp({ action: 'getEmployees' }, res => {
    if (!res.success) return;
    employees = res.data;
    const grid = document.getElementById('nameGrid');
    grid.innerHTML = employees.map(e => `
      <button class="name-btn" onclick="selectUser('${e.name}')">
        ${e.name}
        <span class="dept">${e.department}</span>
      </button>`).join('');
  });
}

function selectUser(name) {
  currentUser = name;
  localStorage.setItem('aab_user', name);
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('mainUI').style.display  = 'block';
  document.getElementById('userName').textContent  = name;
  loadTasks();
}

function changeName() {
  document.getElementById('overlay').style.display = 'flex';
}

function loadTasks() {
  document.getElementById('taskList').innerHTML = '<div class="loading">Loading tasks…</div>';
  jsonp({ action: 'getTasks' }, res => {
    if (!res.success) {
      document.getElementById('taskList').innerHTML = '<div class="loading">Failed to load tasks.</div>';
      return;
    }
    allTasks = res.data;
    renderTasks();
  });
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

function formatComments(raw) {
  if (!raw) return '';
  // Split on newline entries that start with [
  const entries = raw.split(/\n(?=\[)/);
  return entries.map(entry => {
    const match = entry.match(/^\[(.+?)\]\s*(.*)/s);
    if (match) {
      return `<div class="comment-entry"><span class="ts">${match[1]}</span>${match[2]}</div>`;
    }
    return `<div class="comment-entry">${entry}</div>`;
  }).join('');
}

function renderTasks() {
  let tasks = allTasks;
  if (currentTab === 'mine') {
    tasks = tasks.filter(t => t.assignedTo === currentUser);
  } else {
    tasks = tasks.filter(t => t.status !== 'Completed');
  }

  // Stats (always from my tasks)
  const mine  = allTasks.filter(t => t.assignedTo === currentUser);
  const open  = mine.filter(t => ['Open','In Progress'].includes(t.status)).length;
  const done  = mine.filter(t => t.status === 'Completed').length;
  const hold  = mine.filter(t => t.status === 'Hold').length;
  const score = mine.filter(t => t.status === 'Completed').reduce((s,t) => s + (Number(t.score)||0), 0);

  document.getElementById('statsRow').innerHTML = `
    <div class="stat open"><div class="stat-num">${open}</div><div class="stat-label">Open tasks</div></div>
    <div class="stat done"><div class="stat-num">${done}</div><div class="stat-label">Completed</div></div>
    <div class="stat hold"><div class="stat-num">${hold}</div><div class="stat-label">On hold</div></div>
    <div class="stat score"><div class="stat-num">${score}</div><div class="stat-label">My score</div></div>`;

  if (!tasks.length) {
    document.getElementById('taskList').innerHTML = `
      <div class="empty"><div class="icon">✅</div>
      ${currentTab==='mine' ? 'No tasks assigned to you.' : 'No open tasks right now.'}</div>`;
    return;
  }

  const order = { 'Open': 0, 'In Progress': 1, 'Hold': 2, 'Completed': 3 };
  tasks.sort((a,b) => (order[a.status]||0) - (order[b.status]||0) || (a.dueDate||'').localeCompare(b.dueDate||''));

  const today = new Date().toISOString().slice(0,10);

  document.getElementById('taskList').innerHTML = tasks.map(t => {
    const priority    = ['High','Medium','Low'].includes(t.priority) ? t.priority : 'Medium';
    const overdue     = t.dueDate && t.dueDate < today && t.status !== 'Completed';
    const statusClass = (t.status||'Open').replace(' ','-');
    const dueClass    = t.status === 'Completed' ? 'done' : overdue ? 'overdue' : 'normal';

    const dueBlock = t.dueDate ? `
      <div class="due-block ${dueClass}">
        <span class="due-icon">📅</span>
        <div>
          <div class="due-label">Due date</div>
          <div class="due-date ${dueClass}">${t.dueDate}</div>
        </div>
        ${overdue ? `<span class="due-tag overdue">OVERDUE</span>` : ''}
        ${t.status === 'Completed' ? `<span class="due-tag done">DONE</span>` : ''}
      </div>` : '';

    const commentLog = t.comments ? `
      <div class="comment-log">
        <div class="comment-log-title">💬 Updates</div>
        ${formatComments(t.comments)}
      </div>` : '';

    const actions = t.status !== 'Completed' ? `
      <div class="task-actions">
        <div class="action-group">
          <div class="action-label">Status</div>
          <select class="status-select" id="status-${t.taskId}">
            <option ${t.status==='Open'?'selected':''}>Open</option>
            <option ${t.status==='In Progress'?'selected':''}>In Progress</option>
            <option ${t.status==='Hold'?'selected':''}>Hold</option>
            <option>Completed</option>
          </select>
        </div>
        <div class="comment-row">
          <div class="action-group" style="flex:1">
            <div class="action-label">Add update / comment</div>
            <input class="comment-input" id="comment-${t.taskId}" placeholder="Type your update here…">
          </div>
          <button class="save-btn" onclick="saveTask('${t.taskId}')">Save</button>
        </div>
      </div>` : '';

    return `
    <div class="task-card ${t.status==='Completed'?'completed':''}" id="card-${t.taskId}">
      <div class="card-banner ${priority}"></div>
      <div class="card-body">
        <div class="task-top">
          <span class="task-id">${t.taskId}</span>
          <span class="task-name">${t.task}</span>
        </div>
        <div class="task-badges">
          <span class="priority-badge ${priority}">${priority}</span>
          <span class="status-pill ${statusClass}">${t.status}</span>
          ${t.weightage ? `<span style="font-size:12px;color:var(--muted)">⚖️ Weight ${t.weightage}</span>` : ''}
          ${t.status==='Completed' ? `<span class="score-badge">+${t.score||0} pts</span>` : ''}
        </div>
        ${currentTab==='all' ? `<div class="task-assigned">👤 ${t.assignedTo}</div>` : ''}
        ${dueBlock}
        ${commentLog}
        ${actions}
      </div>
    </div>`;
  }).join('');
}

function saveTask(taskId) {
  const statusEl  = document.getElementById('status-' + taskId);
  const commentEl = document.getElementById('comment-' + taskId);
  const btn       = document.querySelector(`#card-${taskId} .save-btn`);
  if (!statusEl) return;

  const newComment = commentEl.value.trim();

  btn.disabled    = true;
  btn.textContent = 'Saving…';

  jsonp({
    action:     'updateTask',
    taskId,
    status:     statusEl.value,
    newComment,
    author:     currentUser
  }, res => {
    btn.disabled    = false;
    btn.textContent = 'Save';
    if (res.success) {
      showToast('Saved ✓');
      commentEl.value = '';
      loadTasks();
    } else {
      showToast('Error: ' + (res.error || 'Failed'));
    }
  });
}

// Init
loadEmployees();
if (currentUser) {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('mainUI').style.display  = 'block';
  document.getElementById('userName').textContent  = currentUser;
  loadTasks();
}
</script>
</body>
</html>
