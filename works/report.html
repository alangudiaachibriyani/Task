<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAB Works Tracker — Dashboard</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0ede6;
    --border: #e2ddd6;
    --text: #1a1917;
    --muted: #7a7670;
    --accent: #c8401a;
    --accent-light: #fdf0eb;
    --green: #1a7a45;
    --green-light: #eaf5ef;
    --amber: #a05c00;
    --amber-light: #fef7ec;
    --blue: #1a4f8a;
    --blue-light: #eaf1fb;
    --gold: #b8860b;
    --silver: #8a8a8a;
    --bronze: #a0622d;
    --radius: 10px;
    --shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  .header { background: var(--text); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  .header img { height: 36px; border-radius: 6px; }
  .header-title { font-size: 16px; font-weight: 600; }
  .header-sub { font-size: 12px; opacity: 0.6; }
  .header-links { margin-left: auto; display: flex; gap: 16px; }
  .header-links a { color: #fff; opacity: 0.6; font-size: 12px; text-decoration: none; }
  .header-links a:hover { opacity: 1; }

  .container { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }

  .filter-row { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-row select, .filter-row input { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--surface); }
  .period-tabs { display: flex; gap: 6px; }
  .period-tab { padding: 7px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--muted); font-weight: 500; }
  .period-tab.active { background: var(--text); color: #fff; border-color: var(--text); }

  /* Summary cards */
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .summary-num { font-size: 26px; font-weight: 700; }
  .summary-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .summary-card.total .summary-num { color: var(--blue); }
  .summary-card.completed .summary-num { color: var(--green); }
  .summary-card.open .summary-num { color: var(--amber); }
  .summary-card.rate .summary-num { color: var(--accent); }

  .section-title { font-size: 15px; font-weight: 600; margin: 26px 0 12px; }

  /* Leaderboard */
  .leaderboard { display: flex; flex-direction: column; gap: 8px; }
  .lb-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); }
  .lb-rank { font-size: 16px; font-weight: 700; width: 28px; text-align: center; color: var(--muted); }
  .lb-rank.gold { color: var(--gold); }
  .lb-rank.silver { color: var(--silver); }
  .lb-rank.bronze { color: var(--bronze); }
  .lb-name { font-weight: 600; font-size: 14px; flex: 1; min-width: 110px; }
  .lb-stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .lb-stats b { color: var(--text); }
  .lb-bar-wrap { flex: 1; min-width: 80px; max-width: 160px; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .lb-bar { height: 100%; background: var(--accent); border-radius: 4px; }
  .lb-score { font-size: 18px; font-weight: 700; color: var(--accent); width: 70px; text-align: right; }

  /* Bars chart (completion) */
  .bars-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-label { width: 100px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .bar-track { flex: 1; height: 18px; background: var(--surface2); border-radius: 4px; overflow: hidden; display: flex; }
  .bar-seg.ontime { background: var(--green); }
  .bar-seg.late { background: var(--amber); }
  .bar-seg.open { background: var(--blue); }
  .bar-seg.hold { background: #c9c5bd; }
  .bar-total { width: 36px; text-align: right; font-size: 12px; font-weight: 600; }
  .legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; }

  .empty { text-align: center; padding: 50px; color: var(--muted); }
  .loading { text-align: center; padding: 50px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <img src="https://raw.githubusercontent.com/alangudiaachibriyani/HR/main/logo.png" alt="AAB" onerror="this.style.display='none'">
  <div>
    <div class="header-title">AAB Works Tracker</div>
    <div class="header-sub">Performance Dashboard</div>
  </div>
  <div class="header-links">
    <a href="tasks.html">Staff view</a>
    <a href="admin.html">Admin panel</a>
  </div>
</div>

<div class="container">
  <div class="filter-row">
    <div class="period-tabs">
      <button class="period-tab active" onclick="setPeriod('all',this)">All time</button>
      <button class="period-tab" onclick="setPeriod('month',this)">This month</button>
      <button class="period-tab" onclick="setPeriod('week',this)">This week</button>
    </div>
    <input type="month" id="monthPicker" onchange="setCustomMonth()">
  </div>

  <div class="summary-grid" id="summaryGrid">
    <div class="summary-card total"><div class="summary-num">—</div><div class="summary-label">Total tasks</div></div>
    <div class="summary-card completed"><div class="summary-num">—</div><div class="summary-label">Completed</div></div>
    <div class="summary-card open"><div class="summary-num">—</div><div class="summary-label">Still open</div></div>
    <div class="summary-card rate"><div class="summary-num">—</div><div class="summary-label">On-time rate</div></div>
  </div>

  <div class="section-title">🏆 Leaderboard</div>
  <div class="leaderboard" id="leaderboard"><div class="loading">Loading…</div></div>

  <div class="section-title">📊 Task breakdown by person</div>
  <div class="bars-card">
    <div id="barsChart"><div class="loading">Loading…</div></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Completed on time</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div> Completed late</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div> Open / in progress</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c9c5bd"></div> On hold</div>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzkkSEMDidoAoHvq7hjepgkI_Xcblh6oPSkysrrfMmK2ntuCyGzfV4uSpZM0D7zqmMO2A/exec';
let allTasks = [];
let period   = 'all';

function jsonp(params, cb) {
  const id = 'cb_' + Date.now() + Math.floor(Math.random()*1000);
  const qs = Object.entries({ ...params, callback: id }).map(([k,v]) => k+'='+encodeURIComponent(v)).join('&');
  const s  = document.createElement('script');
  window[id] = d => { delete window[id]; s.remove(); cb(d); };
  s.src = API + '?' + qs;
  document.head.appendChild(s);
}

function setPeriod(p, el) {
  period = p;
  document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('monthPicker').value = '';
  render();
}

function setCustomMonth() {
  period = 'custom';
  document.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
  render();
}

function loadData() {
  jsonp({ action: 'getTasks' }, res => {
    if (!res.success) {
      document.getElementById('leaderboard').innerHTML = '<div class="empty">Failed to load data.</div>';
      return;
    }
    allTasks = res.data;
    render();
  });
}

function getFilteredTasks() {
  const today = new Date();
  let tasks = [...allTasks];

  if (period === 'month') {
    const ym = today.toISOString().slice(0,7);
    tasks = tasks.filter(t => t.taskDate && t.taskDate.startsWith(ym));
  } else if (period === 'week') {
    const start = new Date(today);
    start.setDate(today.getDate() - today.getDay());
    const startStr = start.toISOString().slice(0,10);
    tasks = tasks.filter(t => t.taskDate && t.taskDate >= startStr);
  } else if (period === 'custom') {
    const ym = document.getElementById('monthPicker').value;
    if (ym) tasks = tasks.filter(t => t.taskDate && t.taskDate.startsWith(ym));
  }
  return tasks;
}

function render() {
  const tasks = getFilteredTasks();

  if (!tasks.length) {
    document.getElementById('summaryGrid').innerHTML = `
      <div class="summary-card total"><div class="summary-num">0</div><div class="summary-label">Total tasks</div></div>
      <div class="summary-card completed"><div class="summary-num">0</div><div class="summary-label">Completed</div></div>
      <div class="summary-card open"><div class="summary-num">0</div><div class="summary-label">Still open</div></div>
      <div class="summary-card rate"><div class="summary-num">—</div><div class="summary-label">On-time rate</div></div>`;
    document.getElementById('leaderboard').innerHTML = '<div class="empty">No tasks in this period.</div>';
    document.getElementById('barsChart').innerHTML = '<div class="empty">No tasks in this period.</div>';
    return;
  }

  // ── Summary ──────────────────────────────────────────────────────────────
  const completed = tasks.filter(t => t.status === 'Completed');
  const open       = tasks.filter(t => t.status !== 'Completed');
  const onTime     = completed.filter(t => t.completedDate && t.dueDate && t.completedDate <= t.dueDate);
  const onTimeRate = completed.length ? Math.round((onTime.length / completed.length) * 100) : 0;

  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card total"><div class="summary-num">${tasks.length}</div><div class="summary-label">Total tasks</div></div>
    <div class="summary-card completed"><div class="summary-num">${completed.length}</div><div class="summary-label">Completed</div></div>
    <div class="summary-card open"><div class="summary-num">${open.length}</div><div class="summary-label">Still open</div></div>
    <div class="summary-card rate"><div class="summary-num">${completed.length ? onTimeRate + '%' : '—'}</div><div class="summary-label">On-time rate</div></div>`;

  // ── Leaderboard ──────────────────────────────────────────────────────────
  const byPerson = {};
  tasks.forEach(t => {
    const name = t.assignedTo || 'Unassigned';
    if (!byPerson[name]) byPerson[name] = { score: 0, total: 0, completed: 0, open: 0, hold: 0, ontime: 0, late: 0 };
    byPerson[name].total++;
    if (t.status === 'Completed') {
      byPerson[name].completed++;
      byPerson[name].score += Number(t.score) || 0;
      if (t.completedDate && t.dueDate && t.completedDate <= t.dueDate) byPerson[name].ontime++;
      else byPerson[name].late++;
    } else if (t.status === 'Hold') {
      byPerson[name].hold++;
    } else {
      byPerson[name].open++;
    }
  });

  const ranked = Object.entries(byPerson).map(([name, d]) => ({ name, ...d })).sort((a,b) => b.score - a.score);
  const maxScore = Math.max(...ranked.map(r => r.score), 1);
  const medals = ['gold','silver','bronze'];

  document.getElementById('leaderboard').innerHTML = ranked.map((r, i) => `
    <div class="lb-row">
      <div class="lb-rank ${medals[i]||''}">${i+1}</div>
      <div class="lb-name">${r.name}</div>
      <div class="lb-stats">
        <span><b>${r.completed}</b>/${r.total} done</span>
        <span><b>${r.open}</b> open</span>
        ${r.hold ? `<span><b>${r.hold}</b> hold</span>` : ''}
      </div>
      <div class="lb-bar-wrap"><div class="lb-bar" style="width:${Math.max(r.score,0)/maxScore*100}%"></div></div>
      <div class="lb-score">${r.score} pts</div>
    </div>`).join('');

  // ── Breakdown bars ───────────────────────────────────────────────────────
  const maxTotal = Math.max(...ranked.map(r => r.total), 1);
  document.getElementById('barsChart').innerHTML = ranked.map(r => `
    <div class="bar-row">
      <div class="bar-label">${r.name}</div>
      <div class="bar-track">
        ${r.ontime ? `<div class="bar-seg ontime" style="width:${r.ontime/maxTotal*100}%"></div>` : ''}
        ${r.late   ? `<div class="bar-seg late" style="width:${r.late/maxTotal*100}%"></div>`     : ''}
        ${r.open   ? `<div class="bar-seg open" style="width:${r.open/maxTotal*100}%"></div>`     : ''}
        ${r.hold   ? `<div class="bar-seg hold" style="width:${r.hold/maxTotal*100}%"></div>`     : ''}
      </div>
      <div class="bar-total">${r.total}</div>
    </div>`).join('');
}

loadData();
</script>
</body>
</html>
